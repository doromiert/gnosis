<!doctype html><title>Gnosis frame pacing fixture</title><style>body{background:#222;color:white}.box{height:100px;width:100px;background:#8e44ad;animation:move 2s linear infinite alternate}@keyframes move{to{transform:translateX(600px) rotate(180deg)}}</style><h1>Frame pacing test</h1><div class=box></div><script>let start=0,last=0,frames=[],handle;window.beginProbe=()=>{start=last=performance.now();frames=[];function frame(now){frames.push(now-last);last=now;handle=requestAnimationFrame(frame)}handle=requestAnimationFrame(frame)};window.endProbe=()=>{cancelAnimationFrame(handle);let elapsed=performance.now()-start;let sorted=frames.slice().sort((a,b)=>a-b);return{elapsed,count:frames.length,rate:frames.length/(elapsed/1000),median:sorted[Math.floor(sorted.length*.5)],p95:sorted[Math.floor(sorted.length*.95)]}}</script>
