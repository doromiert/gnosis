<!doctype html><meta charset=utf-8><title>Scrollbar compatibility fixture</title>
<style>
body{margin:24px;background:#151515;color:white;font:16px system-ui;height:2000px}
.row{display:flex;gap:24px}.scroller{width:240px;height:300px;overflow:auto;background:#292929}.content{height:1500px;padding:12px}.thin{scrollbar-width:thin}.hidden{scrollbar-width:none}
</style>
<button id=control>Vim selection target</button><div class=row>
<div><h2>Auto</h2><div id=auto class=scroller><div class=content>Normal scrollbar</div></div></div>
<div><h2>Thin request</h2><div id=thin class="scroller thin"><div class=content>Same native styling</div></div></div>
<div><h2>Hidden</h2><div id=hidden class="scroller hidden"><div class=content>Intentionally hidden</div></div></div>
</div>
